[package]
name = "zju-connect"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust library and CLI for Sangfor EasyConnect and aTrust VPNs"
license = "AGPL-3.0-only"
repository = "https://github.com/Mythologyli/zju-connect"
publish = false

[lib]
name = "zju_connect"
path = "src/lib.rs"

[[bin]]
name = "zju-connect"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
ipnet = { version = "2.11", features = ["serde"] }
md-5 = "0.10"
native-tls = "0.2"
rand = "0.8"
rc4 = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls-native-roots"] }
roxmltree = "0.20"
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-native-tls = "0.3"
toml = "0.9"
totp-rs = "5.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
x509-parser = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
tun = { version = "0.8.14", features = ["async"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
