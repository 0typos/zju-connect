services:
  sangfordetunz:
    build:
      context: .
    image: sangfordetunz
    container_name: sangfordetunz
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Publish the proxy ports your profiles bind (set their binds to 0.0.0.0).
    ports:
      - "1080:1080"
      - "1081:1081"
    volumes:
      - ./config.toml:/etc/sangfordetunz/config.toml:ro
