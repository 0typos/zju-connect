services:
  zju-connect:
    build:
      context: .
    image: zju-connect-rust
    container_name: zju-connect
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "1080:1080"
      - "1081:1081"
    volumes:
      - ./config.toml:/etc/zju-connect/config.toml:ro
